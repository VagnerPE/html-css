<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario </title>
</head>
<body>
      <h1>Criando formulário com telefone e e-mail</h1>
       <form action="cadastro.php" method="get" autocomplete="on">
         <p>
            <label for="iemail"> E-mail </label>
            <input type="email" name="email" id="iemail" autocomplete="email" size="50" required>
         </p>
         <p>
             <label for="iel"> Telefone</label>
             <input type="tel" name="tel" id="itel" autocomplete="tel" required>
         </p>
         <p>
            <input type="submit" value="Envia">
            <input type="reset" value="Limpar">
         </p>
       </form>
      
</body>
</html>
